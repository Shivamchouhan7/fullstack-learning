<html>
    <head>
        <script>
            function show(event){
                alert(event.target.innerText)
            }   
        </script>
    </head>
    <body>
        <ol id="ol" onclick="show(event)">
            <li>India</li>
            <li>Australia</li>
            <li>SriLanka</li>
            <li>New Zeland</li>
            <li>South Africa</li>
        </ol>
    </body>
</html>

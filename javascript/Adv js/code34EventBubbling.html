<html>
    <head>
        <style>
            div{ height: 100px; width: 50%; background-color: aquamarine;}
        </style>
        <script>
            function parent(){
                    alert("Parent is invoked....")
            }
            function child1(){
                    alert("Child-1 is invoked....")
            }
            function child2(event){
                    alert("Child-2 is invoked....")
                    event.stopPropagation();
            }
        </script>
    </head>
    <body>
        <div id="div" onclick="parent()">
            <button onclick="child1()">Button-1</button>&nbsp;&nbsp;&nbsp;
            <button onclick="child2(event)">Button-2</button>
        </div>
    </body>
</html>
